[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-trading-service"
version = "0.1.0"
description = "Async trading service that consumes Kafka stock signals and executes orders via IBKR's TWS API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Brian" }
]
keywords = ["trading", "kafka", "ibkr", "ib_insync", "async"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiokafka>=0.11.0",
    "ib_insync>=0.9.86",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    "aiofiles>=24.0",
    "attrs>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
stock-trading = "stock_trading.main:main"

[tool.setuptools.packages.find]
include = ["stock_trading*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]
