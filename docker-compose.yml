services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-trading-service:latest
    container_name: trading-service
    env_file: .env
    environment:
      - STOCK_TRADING_CONFIG_FILE=/app/configs/config.dev.yml
      - STOCK_TRADING_ENVIRONMENT=dev
    depends_on:
      - kafka
      - postgres
    volumes:
      - ./configs/config.dev.yml:/app/configs/config.dev.yml:ro
    restart: unless-stopped
    networks:
      - trading

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: trading-service-kafka
    profiles:
      - dev
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_LISTENERS: PLAINTEXT://kafka.internal:9092,PLAINTEXT://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka.internal:9092,PLAINTEXT://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - trading
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 | grep -q 'API versions'"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: trading-service-postgres
    profiles:
      - dev
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "25432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - trading
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kafka-data:
  pg-data:

networks:
  trading:
    driver: bridge
